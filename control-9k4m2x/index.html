<style>
/* Tablero: resumen arriba, detalle por pestañas. Misma identidad que los cursos. */
:root{
  --papel:#EEF2F5; --carta:#FFFFFF; --tinta:#13202C; --gris:#5C7183;
  --azul:#155E93; --azul-sup:#E2EDF5; --azul-bd:#B9D3E6;
  --ambar:#9A6500; --ambar-sup:#FBF1DD; --ambar-bd:#E8CC97;
  --ok:#0B7A4E; --ok-sup:#E1F2EA; --med:#B4791A; --med-sup:#FBF0DB; --mal:#A8362A; --mal-sup:#FAE9E6;
  --bd:#D3DDE5; --bd2:#BAC8D3;
  --som:0 1px 2px rgba(19,32,44,.07), 0 8px 22px -16px rgba(19,32,44,.3);
  --ui:'Barlow',system-ui,-apple-system,Segoe UI,sans-serif;
  --tit:'Barlow Condensed','Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --papel:#0E1821; --carta:#16232E; --tinta:#E6EEF4; --gris:#94A8B8;
  --azul:#6CAEDC; --azul-sup:#13293A; --azul-bd:#27475E;
  --ambar:#E0AC55; --ambar-sup:#2C2314; --ambar-bd:#4E3E1E;
  --ok:#54C492; --ok-sup:#0F2A20; --med:#DDAA4D; --med-sup:#2B2313; --mal:#EE9080; --mal-sup:#2E1A16;
  --bd:#283744; --bd2:#36485A;
  --som:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -16px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --papel:#0E1821; --carta:#16232E; --tinta:#E6EEF4; --gris:#94A8B8;
  --azul:#6CAEDC; --azul-sup:#13293A; --azul-bd:#27475E;
  --ambar:#E0AC55; --ambar-sup:#2C2314; --ambar-bd:#4E3E1E;
  --ok:#54C492; --ok-sup:#0F2A20; --med:#DDAA4D; --med-sup:#2B2313; --mal:#EE9080; --mal-sup:#2E1A16;
  --bd:#283744; --bd2:#36485A;

}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:is(button,input,select,textarea,a):focus-visible{outline:3px solid var(--ambar);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;font-family:var(--tit);text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

.tope{background:var(--carta);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.tope .f{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tope h1{font-size:20px;font-weight:700;letter-spacing:.01em}
.tope .s{font-size:13px;color:var(--gris)}
.tope .d{margin-left:auto;font-size:12.5px;color:var(--gris)}
nav{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 13px;cursor:pointer;
  font-family:var(--tit);font-size:16px;font-weight:600;letter-spacing:.03em;color:var(--gris);white-space:nowrap}
nav button:hover{color:var(--tinta)}
nav button[aria-selected="true"]{color:var(--azul);border-bottom-color:var(--azul)}

.marco{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
.tarj{background:var(--carta);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--som)}
.tarj > h2{font-size:18px;font-weight:700;padding:14px 18px;border-bottom:1px solid var(--bd);letter-spacing:.02em}
.tarj > h2 span{font-family:var(--ui);font-size:13px;font-weight:400;color:var(--gris);margin-left:8px}
.tarj .b{padding:16px 18px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.kpi{background:var(--carta);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;box-shadow:var(--som)}
.kpi .k{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gris)}
.kpi .v{font-family:var(--tit);font-size:34px;font-weight:700;line-height:1.1;margin-top:3px}
.kpi .d{font-size:13px;color:var(--gris);margin-top:2px}
.kpi.b1{border-top:3px solid var(--azul)} .kpi.b2{border-top:3px solid var(--ambar)}

.curso{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.cbloq{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--carta);box-shadow:var(--som)}
.cbloq .h{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}

.cbloq .h .c{font-size:11.5px;font-weight:600;letter-spacing:.06em;border-radius:3px;padding:2px 7px}

.cbloq .b{padding:15px 16px}

.tx{overflow-x:auto}

.btn:hover{filter:brightness(1.1)}
.btn.sec{background:transparent;color:var(--azul)}
.btn.sec:hover{background:var(--azul-sup);filter:none}
.btn.gris{background:transparent;border-color:var(--bd2);color:var(--gris)}
.btn.gris:hover{background:var(--papel);color:var(--tinta)}
.btn.sm{padding:6px 12px;font-size:13.5px}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:13px}

  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--carta);resize:vertical;line-height:1.5}
input[type=text],input[type=number],select{border:1.5px solid var(--bd2);border-radius:6px;padding:8px 10px;background:var(--carta);font-size:14.5px}
label.f{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gris);margin-bottom:5px}
.ayuda{font-size:13.5px;color:var(--gris);line-height:1.55;margin-top:9px}
.ayuda code{background:var(--papel);border:1px solid var(--bd);border-radius:3px;padding:1px 5px;font-size:12.5px}
.msg{margin-top:12px;border-radius:7px;padding:11px 13px;font-size:14px;line-height:1.5}
.msg.ok{background:var(--ok-sup);border:1px solid var(--ok);color:var(--ok)}
.msg.mal{background:var(--mal-sup);border:1px solid var(--mal);color:var(--mal)}
.msg.med{background:var(--med-sup);border:1px solid var(--med);color:var(--med)}
.msg b{font-weight:700}
.vacio{padding:34px 20px;text-align:center;color:var(--gris)}
.vacio .t{font-family:var(--tit);font-size:20px;font-weight:700;color:var(--tinta);margin-bottom:7px}
.vacio p{max-width:46ch;margin:0 auto;font-size:14.5px;line-height:1.6}
.demo{background:var(--ambar-sup);border:1px solid var(--ambar-bd);border-left:4px solid var(--ambar);
  border-radius:0 7px 7px 0;padding:11px 14px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demo b{color:var(--ambar)}
svg.g{width:100%;height:auto;display:block;overflow:visible}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tinta);color:var(--papel);
  padding:11px 18px;border-radius:8px;font-size:14.5px;font-weight:500;z-index:50;box-shadow:0 8px 26px -8px rgba(0,0,0,.55)}
@media (max-width:560px){ .tarj .b{padding:14px} nav{padding:0 14px} .marco{padding-inline:14px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const M = JSON.parse(document.getElementById('meta').textContent);
const LS = 'tablero-sig-v1';
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- decodificación ---------- */
function deb64(s){
  const b = atob(s.replace(/-/g,'+').replace(/_/g,'/'));
  return new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0)));
}
function suma(s){ let n=0; for(let i=0;i<s.length;i++) n=(n*31+s.charCodeAt(i))%1296; return n.toString(36).toUpperCase().padStart(2,'0'); }

/* El teclado del celular "corrige" algunos caracteres al escribir o al reenviar:
   la O detrás de un número se vuelve º (4O -> 4º), la A se vuelve ª, los guiones
   se vuelven rayas largas. Aquí se devuelven a su forma original antes de leer. */
function sanear(t){
  return String(t)
    .replace(/[\u00BA\u00B0\u02DA\u1D52\u2070]/g, 'O')
    .replace(/[\u00AA\u1D43]/g, 'A')
    .replace(/[\u2010-\u2015\u2212\u02D7]/g, '-')
    .replace(/\u00A0/g, ' ')
    .replace(/[\u200B-\u200D\uFEFF]/g, '');
}

/* Intenta armar el registro a partir del cuerpo del código. */
function decodificar(prefijo, cuerpo){
  let txt;
  try { txt = deb64(cuerpo); } catch(e) { return { error: 'El código llegó incompleto o alterado' }; }

     Solo se exige cuando falta la verificación de dos letras del final. */
  const TEXTO = /^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9 .,'()\/-]*$/;
  const limpio = c.length === 10 && isFinite(it) && isFinite(mi) && mi >= 0 &&
    c[2].length >= 3 && c[2].length <= 80 && TEXTO.test(c[2]) &&
    c[3].length <= 80 && TEXTO.test(c[3]) &&
    c[4].length <= 40 && TEXTO.test(c[4]) && /^[0-9.]*$/.test(c[9]);
  return { limpio, reg: {
    curso: c[0], cedula: c[1], nombre: c[2], cargo: c[3], proyecto: c[4], fecha: c[5],
    puntaje: p, intentos: isFinite(it)?it:1, minutos: isFinite(mi)?mi:0,
    erradas: c[9] ? c[9].split('.').filter(Boolean) : []
  }};
}

/* El código viaja por WhatsApp y a veces pierde la verificación de dos letras del
   final, o le queda un guión suelto. Se prueba primero con verificación; si no,
   se acepta el contenido cuando decodifica a un registro completo, pero queda
   marcado como "sin verificar" para que Alba confirme los datos a mano. */
function leerCodigo(raw){
  const s = sanear(raw).trim();
  const m = s.match(/^(SIG|INT)-([A-Za-z0-9\-_]+)$/);
  if (!m) return { error: 'No tiene el formato de un comprobante' };
  const resto = m[2], pruebas = [];
  const v = resto.match(/^(.+)-([A-Za-z0-9]{2})$/);
  if (v) pruebas.push([v[1], v[2].toUpperCase()]);
  const podado = resto.replace(/[-_]+$/, '');
  if (podado !== resto) pruebas.push([podado, null]);
  pruebas.push([resto, null]);
  let ultimo = 'El código llegó incompleto o alterado';
  for (const [cuerpo, ver] of pruebas) {
    const r = decodificar(m[1], cuerpo);
    if (r.error) { ultimo = r.error; continue; }
    if (ver !== null && ver === suma(cuerpo)) return r;
    if (!r.limpio) { ultimo = 'El código llegó incompleto o alterado'; continue; }
    r.reg.sinVerificar = true;
    return r;
  }
  return { error: ultimo };
}

/* Busca códigos en el texto tal como llegó y también con los saltos de línea
   quitados, porque WhatsApp parte los códigos largos en varias líneas. */
function candidatos(texto){
  const t = sanear(texto), vistos = new Set(), lista = [];
  const sumar = s => { if (s.length > 24 && !vistos.has(s)) { vistos.add(s); lista.push(s); } };
  [t, t.replace(/\s+/g, '')].forEach(v => {
    const re = /(?:SIG|INT)-[A-Za-z0-9\-_]{20,}/g;
    let m;
    while ((m = re.exec(v))) {
      /* Al quitar los saltos de línea, dos comprobantes seguidos quedan pegados;
         se prueba el trozo entero y también cortado en cada prefijo. */
      m[0].split(/(?=(?:SIG|INT)-[A-Za-z0-9\-_]{20,})/).filter(Boolean).forEach(sumar);
      sumar(m[0]);
    }
  });
  return lista;
}

/* Dos nombres son la misma persona si uno contiene al otro o comparten dos
   palabras: "YENCY RUBIANO" y "YENCY LORENA RUBIANO" sí; "KAREN SOFIA TORRES
   LASSO" y "MARCO FIDEL GOMEZ CORREDOR" no. */
function palabras(n){
  return String(n).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase().split(/[^A-Z]+/).filter(p => p.length > 1);
}
function mismaPersona(a, b){
  const x = palabras(a), y = palabras(b);
  if (!x.length || !y.length) return true;
  const comunes = x.filter(p => y.includes(p));
  return comunes.length >= Math.min(2, Math.min(x.length, y.length));
}

function registrar(texto){
  let nuevos = 0, repetidos = 0, mejorados = 0, sinVerificar = 0;
  const errores = [], choques = [], porFirma = new Map();
  candidatos(texto).forEach(cod => {
    const l = leerCodigo(cod);
    if (l.error) { errores.push(l.error); return; }
    const f = [l.reg.curso, l.reg.cedula, l.reg.fecha, l.reg.puntaje].join('|');
    const antes = porFirma.get(f);
    if (!antes || (antes.sinVerificar && !l.reg.sinVerificar)) porFirma.set(f, l.reg);
  });
  const leidos = [...porFirma.values()];
  if (!leidos.length) {
    const l = leerCodigo(texto);
    if (l.error) return { errores: [errores[0] || l.error], choques, nuevos:0, repetidos:0, mejorados:0, sinVerificar:0 };
    leidos.push(l.reg);
  }
  leidos.forEach(r => {
    const i = T.registros.findIndex(x => x.curso === r.curso && x.cedula === r.cedula);
    if (i === -1) { T.registros.push(r); nuevos++; if (r.sinVerificar) sinVerificar++; }
    else if (!mismaPersona(T.registros[i].nombre, r.nombre)) {
      choques.push(`En ${M.cursos[r.curso].codigo} la cédula <b>${esc(r.cedula)}</b> ya está ocupada por <b>${esc(T.registros[i].nombre)}</b>, y este comprobante viene a nombre de <b>${esc(r.nombre)}</b>. Una de las dos personas se equivocó al escribir su documento. Quite el registro incorrecto y vuelva a pegar este código.`);
    }
    else if (r.puntaje > T.registros[i].puntaje || r.fecha > T.registros[i].fecha) {
      r.intentos = Math.max(r.intentos, T.registros[i].intentos);
      T.registros[i] = r; mejorados++; if (r.sinVerificar) sinVerificar++;
    } else repetidos++;
  });
  guardar();
  return { errores, choques, nuevos, repetidos, mejorados, sinVerificar };
}

/* ---------- cálculo ---------- */
function aprobado(r){ return r.puntaje >= (M.cursos[r.curso]?.aprobacion ?? 80); }
function personas(){
  const s = new Map();
  T.registros.forEach(r => { if (!s.has(r.cedula)) s.set(r.cedula, { cedula:r.cedula, nombre:r.nombre, cargo:r.cargo, proyecto:r.proyecto }); });
  return [...s.values()];
}
function metricas(curso){
  const rs = T.registros.filter(r => r.curso === curso);
  const ap = rs.filter(aprobado);
  const meta = T.objetivo.length || personas().length;
  return {
    inscritos: rs.length, aprobados: ap.length, reprobados: rs.length - ap.length,
    sinIniciar: Math.max(0, meta - rs.length), meta,
    cobertura: meta ? ap.length / meta : 0,
    promedio: ap.length ? ap.reduce((a,r)=>a+r.puntaje,0) / ap.length : 0,
    promedioTodos: rs.length ? rs.reduce((a,r)=>a+r.puntaje,0) / rs.length : 0,
    primerIntento: rs.length ? rs.filter(r => aprobado(r) && r.intentos === 1).length / rs.length : 0,
    intentos: rs.length ? rs.reduce((a,r)=>a+r.intentos,0) / rs.length : 0,
    minutos: rs.length ? rs.reduce((a,r)=>a+r.minutos,0) / rs.length : 0
  };
}
function porCargo(){
  const m = new Map();
  const base = T.objetivo.length ? T.objetivo : personas();
  base.forEach(p => { if (!m.has(p.cargo)) m.set(p.cargo, { cargo:p.cargo, total:0, SIG:0, INT:0, punt:[] }); m.get(p.cargo).total++; });
  T.registros.forEach(r => {
    if (!m.has(r.cargo)) m.set(r.cargo, { cargo:r.cargo, total:0, SIG:0, INT:0, punt:[] });
    const o = m.get(r.cargo);
    if (aprobado(r)) o[r.curso]++;
    o.punt.push(r.puntaje);
  });
  return [...m.values()].map(o => ({...o, prom: o.punt.length ? o.punt.reduce((a,b)=>a+b,0)/o.punt.length : null}))
    .sort((a,b) => b.total - a.total || a.cargo.localeCompare(b.cargo,'es'));
}
function fallos(curso){
  const c = new Map();
  T.registros.filter(r => r.curso === curso).forEach(r => r.erradas.forEach(id => c.set(id, (c.get(id)||0) + 1)));
  const n = T.registros.filter(r => r.curso === curso).length;
  return [...c.entries()].map(([id,v]) => {
    const info = M.preguntas[curso + ':' + id];
    return { id, veces:v, tasa: n ? v/n : 0, q: info ? info[0] : id, mod: info ? info[1] : null };
  }).sort((a,b) => b.veces - a.veces);
}
function pendientes(curso){
  const hechos = new Set(T.registros.filter(r => r.curso===curso && aprobado(r)).map(r => r.cedula));
  const base = T.objetivo.length ? T.objetivo : personas();
  return base.filter(p => !hechos.has(p.cedula));
}
function serieTiempo(){
  const f = new Map();
  T.registros.forEach(r => {
    if (!f.has(r.fecha)) f.set(r.fecha, { fecha:r.fecha, SIG:0, INT:0 });
    if (aprobado(r)) f.get(r.fecha)[r.curso]++;
  });
  const arr = [...f.values()].sort((a,b) => a.fecha.localeCompare(b.fecha));
  let s=0, i=0;
  return arr.map(d => ({ ...d, aSIG: (s += d.SIG), aINT: (i += d.INT) }));
}

/* ---------- gráficas ---------- */
function gLinea(datos){
  const W=620,H=200,L=38,R=16,T0=14,B=34, iw=W-L-R, ih=H-T0-B;
  if (datos.length < 2) return '';
  const max = Math.max(4, ...datos.map(d => Math.max(d.aSIG, d.aINT)));
  const x = i => L + (datos.length===1 ? iw/2 : iw*i/(datos.length-1));
  const y = v => T0 + ih - ih*(v/max);
  let g = '';
  for (let k=0;k<=4;k++){ const v=max*k/4, yy=y(v);
    g += `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--bd)" stroke-width="1"/>`
      +  `<text x="${L-7}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--gris)">${Math.round(v)}</text>`; }
  [['aSIG','SIG'],['aINT','INT']].forEach(([k,c]) => {
    const d = datos.map((p,i) => `${i?'L':'M'}${x(i)} ${y(p[k])}`).join(' ');
    g += `<path d="${d}" fill="none" stroke="${COL[c]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = datos.length-1;
    g += `<circle cx="${x(li)}" cy="${y(datos[li][k])}" r="4.5" fill="${COL[c]}" stroke="var(--carta)" stroke-width="2"/>`;
    g += `<text x="${x(li)+9}" y="${y(datos[li][k])+4}" font-size="12" font-weight="600" fill="${COL[c]}">${datos[li][k]}</text>`;
  });
  datos.forEach((p,i) => { if (i===0 || i===datos.length-1 || datos.length<7)
    g += `<text x="${x(i)}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="var(--gris)">${p.fecha.slice(5)}</text>`; });
  return `<svg class="g" viewBox="0 0 ${W} ${H}" font-family="var(--ui)">${g}</svg>`;
}
function gBarras(items, color){
  if (!items.length) return '';
  const max = Math.max(...items.map(i => i.veces));
  return `<div style="display:flex;flex-direction:column;gap:9px">` + items.map(i => `
    <div>
      <div style="display:flex;gap:10px;align-items:baseline;margin-bottom:4px">
        <span style="font-size:14px;line-height:1.4;flex:1;min-width:0">${esc(i.q)}</span>
        <span class="num" style="font-size:13px;font-weight:700;white-space:nowrap">${i.veces} ${i.veces===1?'persona':'personas'} · ${pct(i.tasa)}</span>
      </div>
      <div class="bar" style="height:9px"><i style="width:${Math.max(4,i.veces/max*100)}%;background:${color}"></i></div>
    </div>`).join('') + `</div>`;
}

    <div class="fila">
      <button type="button" class="btn" id="bRegistrar">Registrar</button>
      <button type="button" class="btn gris" id="bLimpiar">Limpiar</button>
    </div>
    <div id="rMsg"></div>
  </div></div>
  ${(() => {
    const porCed = new Map();
    T.registros.forEach(r => { if (!porCed.has(r.cedula)) porCed.set(r.cedula, []); porCed.get(r.cedula).push(r); });
    const graves = [], leves = [];
    porCed.forEach((rs, ced) => {
      const nombres = [...new Set(rs.map(r => r.nombre))];
      if (nombres.length < 2) return;
      const distintas = nombres.some(a => nombres.some(b => !mismaPersona(a, b)));
      (distintas ? graves : leves).push({ ced, nombres });
    });
    if (!graves.length && !leves.length) return '';
    return `<div class="tarj"><h2>Documentos por revisar<span>${graves.length + leves.length}</span></h2>
      ${graves.map(g => `<div class="msg mal">La cédula <b>${esc(g.ced)}</b> aparece con dos personas distintas:
        ${g.nombres.map(n => `<b>${esc(n)}</b>`).join(' y ')}. Una de las dos escribió mal su documento al
        inscribirse, y por eso un comprobante puede no estar entrando. Quite el registro equivocado y pida
        a esa persona que repita el curso con su cédula correcta.</div>`).join('')}
      ${leves.map(l => `<div class="msg med">La cédula <b>${esc(l.ced)}</b> está escrita con el nombre de dos
        formas: ${l.nombres.map(n => `<b>${esc(n)}</b>`).join(' y ')}. Es la misma persona; los informes usarán
        la primera forma.</div>`).join('')}
    </div>`;
  })()}
  <div class="tarj"><h2>Comprobantes recibidos<span>${T.registros.length}</span></h2>
    ${T.registros.length ? `<div class="tx"><table>
      <thead><tr><th>Nombre</th><th>Cédula</th><th>Cargo</th><th>Curso</th><th class="r">Puntaje</th><th class="r">Intentos</th><th>Fecha</th><th></th></tr></thead>
      <tbody>${[...T.registros].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map((r,i) => `<tr>
        <td style="white-space:normal">${esc(r.nombre)}${r.sinVerificar?' <span class="chip med" title="El código llegó sin su verificación final. Confirme los datos con la persona.">sin verificar</span>':''}</td><td class="num">${esc(r.cedula)}</td>
        <td style="white-space:normal">${esc(r.cargo)}</td>
        <td><span class="chip ${r.curso==='SIG'?'gris':'gris'}">${esc(M.cursos[r.curso].codigo)}</span></td>
        <td class="r"><span class="chip ${aprobado(r)?'ok':'mal'}">${r.puntaje}%</span></td>
        <td class="r num">${r.intentos}</td><td class="num">${esc(r.fecha)}</td>
        <td class="r"><button type="button" class="btn sm gris" data-del="${esc(r.curso+'|'+r.cedula)}">Quitar</button></td>
      </tr>`).join('')}</tbody></table></div>`
      : `<div class="vacio"><p>Aún no hay comprobantes. Pegue el primero arriba.</p></div>`}
  </div>`;
  $('#bRegistrar').onclick = () => {
    const v = $('#caja').value.trim();
    if (!v) return;
    const r = registrar(v);
    const partes = [];
    if (r.nuevos) partes.push(`<b>${r.nuevos}</b> ${r.nuevos===1?'comprobante nuevo':'comprobantes nuevos'}`);
    if (r.mejorados) partes.push(`<b>${r.mejorados}</b> ${r.mejorados===1?'actualizado':'actualizados'}`);
    if (r.repetidos) partes.push(`<b>${r.repetidos}</b> ya ${r.repetidos===1?'estaba':'estaban'} con mejor resultado`);
    const m = $('#rMsg');
    const avisoChoque = (r.choques||[]).map(c => `<div class="msg mal">${c}</div>`).join('');
    if (!partes.length && avisoChoque) m.innerHTML = avisoChoque;
    else if (!partes.length && r.errores.length) m.innerHTML = `<div class="msg mal">No se registró nada. ${esc(r.errores[0])}. Pida que le reenvíen el código completo, sin cortar.</div>`;
    else { $('#caja').value = ''; m.innerHTML = `<div class="msg ok">Registrado: ${partes.join(', ')}.${r.errores.length?` ${r.errores.length} código(s) con problema.`:''}</div>`
        + avisoChoque
        + (r.sinVerificar?`<div class="msg med">${r.sinVerificar===1?'Un comprobante llegó':`${r.sinVerificar} comprobantes llegaron`} sin la verificación del final, probablemente porque el código se cortó al copiarlo. El contenido se leyó completo y quedó guardado, pero aparece marcado <b>sin verificar</b>: confirme el nombre y el puntaje con la persona.</div>`:'');
      setTimeout(() => vRegistrar(), 1400); }
  };
  $('#bLimpiar').onclick = () => { $('#caja').value=''; $('#rMsg').innerHTML=''; };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const [c,ced] = b.dataset.del.split('|');
    T.registros = T.registros.filter(r => !(r.curso===c && r.cedula===ced));
    guardar(); vRegistrar();
  });
}
function vDatos(){
  $('#vista').innerHTML = `
  <div class="tarj"><h2>Personal objetivo<span>${T.objetivo.length} ${T.objetivo.length===1?'persona':'personas'}</span></h2><div class="b">
    <p class="ayuda" style="margin-top:0">Pegue aquí el listado del personal que debe tomar los cursos. Un renglón por persona, separando con punto y coma o tabulación:
      <code>cédula;nombre;cargo;proyecto</code>. Sin esta lista, la cobertura se calcula solo sobre quienes ya iniciaron.</p>
    <textarea id="cajaP" rows="6" placeholder="52123456;Alba Lucía Calderón;Director de Interventoría;PAS 50262">${esc(T.objetivo.map(p=>[p.cedula,p.nombre,p.cargo,p.proyecto].join(';')).join('\n'))}</textarea>
    <div class="fila">
      <button type="button" class="btn" id="bPersonal">Guardar listado</button>
      <button type="button" class="btn gris" id="bBorrarP">Borrar listado</button>
    </div>
    <div id="pMsg"></div>
  </div></div>

  <div class="tarj"><h2>Reporte para gerencia</h2><div class="b">
    <p class="ayuda" style="margin-top:0">Genera el resumen ejecutivo con los indicadores de cobertura y eficacia, listo para pegar en un correo o en el acta de seguimiento.</p>
    <div class="fila">
      <button type="button" class="btn" id="bResumen">Copiar resumen ejecutivo</button>
      <button type="button" class="btn sec" id="bCsv">Copiar registro completo</button>
    </div>
    <div id="eMsg"></div>
  </div></div>

  <div class="tarj"><h2>Respaldo</h2><div class="b">
    <p class="ayuda" style="margin-top:0">Los datos quedan guardados en este navegador. Copie el respaldo si va a cambiar de equipo o quiere conservar una copia.</p>
    <div class="fila">
      <button type="button" class="btn sec" id="bExp">Copiar respaldo</button>
      <button type="button" class="btn gris" id="bImp">Restaurar desde respaldo</button>
      <button type="button" class="btn gris" id="bReset" style="margin-left:auto">Borrar todo</button>
    </div>

  </div></div>`;

  $('#bPersonal').onclick = () => {
    const filas = $('#cajaP').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const lista = [];
    filas.forEach(l => {
      const c = l.split(/[;\t]/).map(s => s.trim());
      const ced = (c[0]||'').replace(/\D/g,'');
      if (ced.length >= 6) lista.push({ cedula:ced, nombre:c[1]||'', cargo:c[2]||'Sin cargo', proyecto:c[3]||'' });
    });
    T.objetivo = lista; guardar();
    $('#pMsg').innerHTML = lista.length ? `<div class="msg ok">Listado guardado: <b>${lista.length}</b> ${lista.length===1?'persona':'personas'}.</div>`
      : `<div class="msg mal">No se reconoció ninguna línea. Verifique que cada renglón empiece por la cédula.</div>`;
  };
  $('#bBorrarP').onclick = () => { T.objetivo = []; guardar(); vDatos(); };
  $('#bResumen').onclick = () => copiar(resumenEjecutivo(), 'Resumen copiado. Ya lo puede pegar.');
  $('#bCsv').onclick = () => copiar(csv(), 'Registro copiado. Péguelo en Excel.');
  $('#bExp').onclick = () => copiar(JSON.stringify(T), 'Respaldo copiado. Guárdelo en un archivo de texto.');
  $('#bImp').onclick = () => {
    const t = prompt ? null : null;
    $('#bMsg').innerHTML = `<label class="f" style="margin-top:14px">Pegue aquí el respaldo</label>
      <textarea id="cajaB" rows="4"></textarea>
      <div class="fila"><button type="button" class="btn sm" id="bImpOk">Restaurar</button></div>`;
    $('#bImpOk').onclick = () => {
      try {
        const d = JSON.parse($('#cajaB').value);
        if (!Array.isArray(d.registros)) throw 0;
        T = { registros:d.registros, objetivo:d.objetivo||[], demo:!!d.demo };
        guardar(); tab='general'; pintar();
      } catch(e) { $('#bMsg').innerHTML = `<div class="msg mal">Ese texto no es un respaldo válido.</div>`; }
    };
  };
  $('#bReset').onclick = () => {
    $('#bMsg').innerHTML = `<div class="msg mal">Esto borra todos los comprobantes y el listado de personal.
      <button type="button" class="btn sm gris" id="bResetOk" style="margin-left:10px">Sí, borrar todo</button></div>`;
    $('#bResetOk').onclick = () => { T = {registros:[],objetivo:[],demo:false}; guardar(); tab='general'; pintar(); };
  };
}

/* ---------- salidas ---------- */
function resumenEjecutivo(){
  const g = metricas('SIG'), i = metricas('INT'), gente = personas();
  const meta = T.objetivo.length || gente.length;
  const ambos = gente.filter(p => ['SIG','INT'].every(c => T.registros.some(r => r.cedula===p.cedula && r.curso===c && aprobado(r)))).length;
  const topS = fallos('SIG').slice(0,3), topI = fallos('INT').slice(0,3);
  const L = [];
  L.push('SEGUIMIENTO DE FORMACIÓN — SISTEMA INTEGRADO DE GESTIÓN');
  L.push('ING Ingeniería S.A.S. · Corte ' + new Date().toLocaleDateString('es-CO'));
  L.push('');
  L.push('COBERTURA');
  L.push(`Personal objetivo: ${meta}`);
  L.push(`Personas inscritas: ${gente.length}`);
  L.push(`Completaron ambos cursos: ${ambos} (${pct(meta?ambos/meta:0)})`);
  L.push('');
  [['SIG',g],['INT',i]].forEach(([c,m]) => {
    L.push(`${M.cursos[c].codigo} — ${M.cursos[c].titulo}`);
    L.push(`  Aprobados: ${m.aprobados} de ${m.meta} (${pct(m.cobertura)})`);
    L.push(`  Puntaje promedio: ${num(m.promedio)}%`);
    L.push(`  Aprobación en primer intento: ${pct(m.primerIntento)}`);
    L.push(`  Intentos promedio: ${num(m.intentos,1)}`);
    L.push('');
  });
  L.push('BRECHAS DE CONOCIMIENTO IDENTIFICADAS');
  if (topS.length) { L.push(`${M.cursos.SIG.codigo}:`); topS.forEach(f => L.push(`  - ${f.q} (${f.veces} personas, ${pct(f.tasa)})`)); }
  if (topI.length) { L.push(`${M.cursos.INT.codigo}:`); topI.forEach(f => L.push(`  - ${f.q} (${f.veces} personas, ${pct(f.tasa)})`)); }
  if (!topS.length && !topI.length) L.push('  Sin errores registrados.');
  L.push('');
  L.push('PENDIENTES');
  L.push(`  ${M.cursos.SIG.codigo}: ${pendientes('SIG').length} personas`);
  L.push(`  ${M.cursos.INT.codigo}: ${pendientes('INT').length} personas`);
  L.push('');
  L.push('Evidencia: comprobante individual de formación con declaración de conocimiento (equivalente GH-4).');
  return L.join('\n');
}
function csv(){
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const cab = ['Cedula','Nombre','Cargo','Proyecto','Curso','Codigo','Fecha','Puntaje','Aprobado','Intentos','Minutos','PreguntasFalladas'];
  const f = T.registros.map(r => [r.cedula,r.nombre,r.cargo,r.proyecto,M.cursos[r.curso].titulo,M.cursos[r.curso].codigo,
    r.fecha,r.puntaje,aprobado(r)?'SI':'NO',r.intentos,r.minutos,r.erradas.join(' ')].map(q).join(';'));
  return [cab.map(q).join(';'), ...f].join('\r\n');
}
async function copiar(texto, ok){
  try { await navigator.clipboard.writeText(texto); aviso(ok); }
  catch(e) {
    const el = document.createElement('textarea');
    el.value = texto; el.style.position='fixed'; el.style.opacity='0';
    document.body.appendChild(el); el.select();
    try { document.execCommand('copy'); aviso(ok); } catch(e2) { aviso('No se pudo copiar en este navegador.'); }
    el.remove();
  }
}
let tT;
function aviso(t){
  clearTimeout(tT);
  let n = document.querySelector('.toast');
  if (!n) { n = document.createElement('div'); n.className='toast'; document.body.appendChild(n); }
  n.textContent = t; tT = setTimeout(() => n.remove(), 3600);
}
